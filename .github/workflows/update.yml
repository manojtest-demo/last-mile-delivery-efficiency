name: Auto Generate LMEI Outputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib scipy scikit-learn

      - name: Run pipeline
        run: python scripts/generate_output.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto update LMEI outputs" || echo "No changes"

      - name: Sync and push
        run: |
          git fetch origin main
          git rebase origin/main || true
          git push --force-with-lease origin HEAD:main
