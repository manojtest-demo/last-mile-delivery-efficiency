name: Auto Generate LMEI Outputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # runs every hour

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib scipy scikit-learn

      - name: Run pipeline
        run: |
          python scripts/generate_output.py

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Commit changes
        run: |
          git add -A
          git commit -m "Auto update LMEI outputs" || echo "No changes to commit"

      - name: Pull latest changes (rebase)
        run: |
          git pull origin main --rebase || echo "Nothing to rebase"

      - name: Push changes safely
        run: |
          git push origin HEAD:main || git push --force-with-lease origin HEAD:main
