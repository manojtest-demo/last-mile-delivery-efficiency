name: Auto Update Artifacts

on:
  workflow_dispatch:   # manual run button
  schedule:
    - cron: "0 * * * *"   # runs every hour (change if needed)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (if any)
        run: |
          pip install -r requirements.txt || echo "No requirements"

      - name: Run your script
        run: python scripts/generate_output.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto अपडेट artifacts" || echo "No changes"

      - name: Push changes
        run: git push
