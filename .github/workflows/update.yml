name: Auto Update Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ IMPORTANT FIX (full history)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run script
        run: python scripts/generate_output.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto update artifacts" || echo "No changes"

      # ✅ Proper sync with remote
      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main || git rebase --abort

      - name: Push changes
        run: git push origin HEAD:main
