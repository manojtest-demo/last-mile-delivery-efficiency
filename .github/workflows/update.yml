name: Auto Generate LMEI Outputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # runs every hour

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib scipy scikit-learn

      # 🔥 STEP 1: Configure git
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # 🔥 STEP 2: Sync with latest remote BEFORE running pipeline
      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main || true

      # 🔥 STEP 3: Run your pipeline
      - name: Run pipeline
        run: |
          python scripts/generate_output.py

      # 🔥 STEP 4: Commit outputs
      - name: Commit changes
        run: |
          git add -A
          git commit -m "Auto update LMEI outputs" || echo "No changes to commit"

      # 🔥 STEP 5: Push safely
      - name: Push changes
        run: |
          git push origin HEAD:main || git push --force-with-lease origin HEAD:main
